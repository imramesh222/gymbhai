# End-to-end tests run against a production build of the web app, as in CI:
# a dev server compiles pages on demand and can't keep up with parallel tests.
#   make e2e

# The tests sign up gyms through the real form, so every run leaves real rows
# behind. They get their own database for that; the development one stays the
# gyms you made yourself. `make e2e` creates it, and the api migrates it on
# start.
x-e2e-database: &e2e-database
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gymbhai}:${POSTGRES_PASSWORD:-gymbhai}@db:5432/${POSTGRES_DB:-gymbhai}_e2e
  # Nothing leaves the machine: a developer's .env may send real email or SMS,
  # and the tests use made-up addresses and numbers.
  EMAIL_PROVIDER: console
  SMS_PROVIDER: console
  WHATSAPP_PROVIDER: console
  # The browser running the tests is on this machine: links the API makes (a
  # wallet's checkout, §20.2) must open here, not at the address
  # `make mobile-env` gives the phone.
  PUBLIC_APP_URL: http://localhost:${WEB_PORT:-3000}
  # Push switched on, logged not sent: a key made for the tests alone.
  PUSH_PROVIDER: console
  VAPID_PRIVATE_KEY: r6AP-6DFOTeSWbF00ghu1XlddwGWOeRJmODHuo02Siw

services:
  api:
    environment: *e2e-database

  worker:
    environment: *e2e-database

  web:
    # .next is shared with the dev server; its generated dev types would be
    # type-checked by the build, so they go first.
    command: sh -c "rm -rf .next/dev && npm run build && npm start -- --hostname 0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/signup').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
