name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymbahi
          POSTGRES_PASSWORD: gymbahi
          POSTGRES_DB: gymbahi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymbahi" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://gymbahi:gymbahi@localhost:5432/gymbahi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests scripts alembic
          ruff format --check app tests scripts alembic
      - name: Migrations apply, match the models, and roll back
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymbahi
          POSTGRES_PASSWORD: gymbahi
          POSTGRES_DB: gymbahi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymbahi" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://gymbahi:gymbahi@localhost:5432/gymbahi
      # Read by `next build`, which fixes the /api rewrite at build time.
      API_INTERNAL_URL: http://localhost:8000
      # The member sign-in code in end-to-end tests (refused in production).
      OTP_TEST_CODE: "246810"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API and the worker
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup python -m app.worker > ../worker.log 2>&1 &
      - name: Build and start the web app
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npm start > ../web.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null &&
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        run: tail -n 200 api.log worker.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The Docker images build
        run: docker compose build
