name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymbhai
          POSTGRES_PASSWORD: gymbhai
          POSTGRES_DB: gymbhai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymbhai" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://gymbhai:gymbhai@localhost:5432/gymbhai
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests scripts alembic
          ruff format --check app tests scripts alembic
      - name: Migrations apply, match the models, and roll back
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymbhai
          POSTGRES_PASSWORD: gymbhai
          POSTGRES_DB: gymbhai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymbhai" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://gymbhai:gymbhai@localhost:5432/gymbhai
      # Read by `next build`, which fixes the /api rewrite at build time.
      API_INTERNAL_URL: http://localhost:8000
      # The member sign-in code in end-to-end tests (refused in production).
      OTP_TEST_CODE: "246810"
      # Every e2e request comes from one address.
      OTP_PER_IP: "1000"
      E2E_ADMIN_EMAIL: e2e-admin@gymbhai.com
      E2E_ADMIN_PASSWORD: e2e-admin-password-123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API and the worker
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          echo "$E2E_ADMIN_PASSWORD" | python -m scripts.create_platform_admin \
            --name "E2E admin" --email "$E2E_ADMIN_EMAIL" --password-stdin
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup python -m app.worker > ../worker.log 2>&1 &
      - name: Build and start the web app
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npm start > ../web.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null &&
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        run: tail -n 200 api.log worker.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .e2e/report

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The development images build
        run: docker compose build
      - name: The production images build
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod build
