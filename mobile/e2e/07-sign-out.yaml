# Sign out (after a confirmation); the phone still knows the gym.
appId: ${APP_ID}
name: Sign out and switch gym
---
- runFlow: subflows/open.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      PHONE: "9800000105"
- extendedWaitUntil:
    visible: "Hi Bina!"
    timeout: 30000
- tapOn:
    id: tab-me
- scrollUntilVisible:
    element:
      id: sign-out
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: sign-out
# A sheet from the bottom: cancelling keeps them signed in.
- waitForAnimationToEnd
- tapOn:
    id: cancel-sign-out
- assertNotVisible:
    id: confirm-sign-out
- tapOn:
    id: sign-out
- waitForAnimationToEnd
- tapOn:
    id: confirm-sign-out
- extendedWaitUntil:
    visible:
      id: who
    timeout: 20000
- tapOn: "Switch gym"
- assertVisible: "App Test Gym"
