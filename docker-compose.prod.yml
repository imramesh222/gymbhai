# Production: one VPS, Docker Compose, Caddy in front (PLAN.md §13).
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# See docs/DEPLOY.md.
name: gymbhai-prod

x-backend: &backend
  build:
    context: ./backend
  restart: unless-stopped
  env_file: .env.prod
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ENVIRONMENT: production

services:
  db:
    # Postgres 16 with pgBackRest, the same image as `backup` (deploy/backup).
    build: ./deploy/backup
    restart: unless-stopped
    # The S3 settings, for archiving (deploy/backup/pgbackrest-env.sh).
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Every finished WAL segment goes to R2, and a segment finishes at least
    # once a minute: a lost server loses about a minute, not a day (PLAN.md
    # §11). On the command line, not in postgresql.conf, so a restored copy
    # never archives into the live archive.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/pgbackrest-archive-push.sh %p
      - -c
      - archive_timeout=60
    # No published port: only the other containers reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Shared with `backup`, which takes base backups over this socket.
      - pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  backup:
    # Base backups for point-in-time restores, and the nightly pg_dump.
    build: ./deploy/backup
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      # pgBackRest reads the data files directly; it never writes them here.
      - pgdata:/var/lib/postgresql/data:ro
      - pgsocket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgsocket:
  caddy_data:
  caddy_config:
